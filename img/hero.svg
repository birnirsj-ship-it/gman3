<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Gman, lukkudýr leiksins, hoppar á milli þriggja staða á korti af miðbænum</title>
<style>
.d{animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-240px);opacity:0}to{transform:none;opacity:1}}
.w{transform:translate(110px,190px);animation:walk 8s ease-in-out 1.2s infinite alternate both}
@keyframes walk{0%,12%{transform:translate(110px,190px)}32%{transform:translate(240px,190px)}48%,60%{transform:translate(240px,270px)}84%,100%{transform:translate(370px,270px)}}
.h{animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-9px)}}
.e{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.a{transform-box:fill-box;transform-origin:0 100%;animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(20deg)}}
.s{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(2.4);opacity:0}}
.r{stroke-dasharray:6 8;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@media(prefers-reduced-motion:reduce){.d,.w,.h,.e,.a,.s,.r{animation:none}}
</style>
